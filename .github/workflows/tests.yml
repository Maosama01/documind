name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    services:
      # The same image as docker-compose.yml, so the db tests run against pgvector.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: documind_user
          POSTGRES_PASSWORD: documind_pass
          POSTGRES_DB: documind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U documind_user -d documind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://documind_user:documind_pass@localhost:5432/documind_test
      # Fail, instead of skipping, if the database tests cannot reach Postgres.
      REQUIRE_TEST_DB: "1"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      # The CPU-only torch build: the tests never run the real model, and the
      # default Linux build also installs NVIDIA's CUDA libraries.
      - name: Install dependencies
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-dev.txt

      - name: Run tests
        run: pytest

      # The frontend's types are generated from this schema; a route or model
      # change without re-exporting it would leave the frontend out of date.
      - name: Check frontend/openapi.json matches the API
        env:
          SECRET_KEY: schema-export-only-not-a-real-secret-0123456789
        run: |
          python -m scripts.export_openapi
          git diff --exit-code -- ../frontend/openapi.json

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check the API types match frontend/openapi.json
        run: |
          npm run api:types
          git diff --exit-code -- src/api/schema.d.ts

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

  docker:
    # Builds the API and web images and starts the stack exactly as
    # docker-compose.yml describes, then drives it end to end: the stdlib smoke
    # test through nginx's /api, and a real browser through the web app.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Create backend/.env with a throwaway SECRET_KEY
        run: python3 -c "import secrets; print('SECRET_KEY=' + secrets.token_hex(32))" > backend/.env

      - name: Build and start the stack
        run: docker compose up --build --wait

      - name: Smoke test through the web server
        run: python3 backend/scripts/smoke_test.py http://localhost:3000/api

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Playwright and Chromium
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: End-to-end test in a browser
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:3000
        run: npx playwright test

      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Show container logs
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
