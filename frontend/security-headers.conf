# Included in every location: nginx drops server-level add_header lines in a
# location that sets its own, so the headers live here instead.
#
# The sign-in token is in sessionStorage, readable by any script on the page,
# so the policy only lets scripts come from this origin. Styles may also come
# from Google Fonts and fonts from its font host; the PDF viewer frames blob:
# URLs the app creates itself; nothing may frame the app.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
