# Serves the built site and forwards /api/* to the API, so the browser talks
# to one origin and the API needs no CORS for the frontend.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Uploads are capped at 10 MB by the API; allow a little for the form's overhead.
    client_max_body_size 11m;

    location /api/ {
        # The trailing slash strips the /api prefix: /api/documents/ -> /documents/
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # An LLM answer can take a while (the API's own provider timeout is 30 s).
        proxy_read_timeout 120s;
    }

    # Built files have content hashes in their names, so they can be cached for good.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Every other path is a route of the single-page app.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
