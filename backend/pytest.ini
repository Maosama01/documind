[pytest]
# Run from backend/: the package is imported as `app`, which lives here.
pythonpath = .
testpaths = tests
# -ra prints a summary line for every skipped test with its reason,
# so a skipped database test is never mistaken for a passing one.
addopts = -ra
markers =
    db: needs the Postgres test database; skipped with the reason shown when it is not reachable
# A deprecation warning raised from our own code (modules under app.) fails
# the run, so deprecated calls are fixed when they appear, not years later.
filterwarnings =
    error::DeprecationWarning:app\.
