services:
  # PostgreSQL Database
  db:
    image: pgvector/pgvector:pg16
    # PostgreSQL 16 with the pgvector extension, which adds the vector column
    # type and the <=> cosine distance operator that search uses.
    # Only the database runs in Docker; start the API with uvicorn (see README).

    container_name: documind_db
    # A friendly name so we can identify this container

    environment:
      POSTGRES_USER: documind_user
      POSTGRES_PASSWORD: documind_pass
      POSTGRES_DB: documind
      # These create a database called "documind"
      # with username "documind_user" and password "documind_pass"
      # (local development credentials only)

    ports:
      - "5432:5432"
      # Format: "host_port:container_port"
      # PostgreSQL runs on port 5432 inside the container
      # and is exposed on localhost:5432. If another PostgreSQL already listens
      # on 5432 on this machine, connections to localhost may reach it instead.

    volumes:
      - postgres_data:/var/lib/postgresql/data
      # This saves the database data even if the container stops
      # Without this, all data disappears when container stops

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documind_user -d documind"]
      interval: 5s
      timeout: 5s
      retries: 5
      # Docker marks the container healthy once Postgres accepts connections
      # (visible in `docker compose ps`). Nothing else waits on it.

volumes:
  postgres_data:
  # Defines the named volume used above
  # Docker manages this storage automatically
