services:
  # PostgreSQL Database
  db:
    image: pgvector/pgvector:pg16
    # PostgreSQL 16 with the pgvector extension, which adds the vector column
    # type and the <=> cosine distance operator that search uses.

    container_name: documind_db
    # A friendly name so we can identify this container

    environment:
      POSTGRES_USER: documind_user
      POSTGRES_PASSWORD: documind_pass
      POSTGRES_DB: documind
      # These create a database called "documind"
      # with username "documind_user" and password "documind_pass"
      # (local development credentials only)

    ports:
      - "5432:5432"
      # Format: "host_port:container_port"
      # Exposed on localhost:5432 for the tests and for running the API with
      # uvicorn on the host. The api service below does not need it: it
      # reaches the database as "db" on Docker's network. If another PostgreSQL
      # already listens on 5432 on this machine, connections to localhost from
      # the host may reach it instead.

    volumes:
      - postgres_data:/var/lib/postgresql/data
      # This saves the database data even if the container stops
      # Without this, all data disappears when container stops

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documind_user -d documind"]
      interval: 5s
      timeout: 5s
      retries: 5
      # Docker marks the container healthy once Postgres accepts connections.
      # The api service waits for that before it starts.

  # The DocuMind API, built from backend/Dockerfile
  api:
    build: ./backend
    container_name: documind_api

    depends_on:
      db:
        condition: service_healthy

    env_file:
      - backend/.env
      # SECRET_KEY and the LLM settings, read when the container starts and
      # never built into the image. Copy backend/.env.example to create it.
      # If it is missing, starting the api service stops with an error naming
      # the file; `docker compose up -d db` alone does not need it.

    environment:
      DATABASE_URL: postgresql://documind_user:documind_pass@db:5432/documind
      # Overrides any DATABASE_URL in backend/.env: inside Docker the database
      # is the "db" service, not localhost.

    ports:
      - "8000:8000"

    volumes:
      - uploads:/app/uploads
      # Uploaded PDFs survive container rebuilds

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 12

  # The web app, built from frontend/Dockerfile: nginx serves it on
  # http://localhost:3000 and forwards /api to the api service.
  web:
    build: ./frontend
    container_name: documind_web

    depends_on:
      api:
        condition: service_healthy

    ports:
      - "3000:80"
      # The Vite dev server (npm run dev) also uses 3000: run one or the other.

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  uploads:
  # Named volumes; Docker manages this storage automatically
